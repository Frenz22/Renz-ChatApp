<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Chat App</h1>
            <p>Enter your credentials to join the chat</p>
            
            <div class="tabs">
                <button class="tab active" data-tab="login">Login</button>
                <button class="tab" data-tab="signup">Sign Up</button>
            </div>
            
            <form id="authForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required 
                           pattern="[a-zA-Z0-9_]{3,15}" 
                           title="3-15 characters, letters, numbers, and underscores only"
                           placeholder="Enter username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required 
                               minlength="6"
                               title="At least 6 characters"
                               placeholder="Enter password">
                        <button type="button" class="toggle-password" data-target="password">👁️</button>
                    </div>
                </div>
                
                <div id="signupFields" class="hidden">
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-input">
                            <input type="password" id="confirmPassword" name="confirmPassword" 
                                   placeholder="Confirm password">
                            <button type="button" class="toggle-password" data-target="confirmPassword">👁️</button>
                        </div>
                    </div>
                </div>
                
                <button type="submit" id="submitBtn">Login</button>

                <div class="guest-login">
                    <p class="guest-text">Don't want to create or have an account?</p>
                    <button type="button" id="guestLoginBtn" class="guest-btn">Use Guest</button>
                </div>
                
                <div id="message" class="message"></div>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
